name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_PROJECT_NAME: schematic-airlock
  RELEASE_PROJECT_VERSION: "0.7.0"
  RELEASE_SYFT_VERSION: "1.51.1"

jobs:
  verify-ci:
    name: Require main ancestry and successful CI
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag commit is reachable from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "release workflow must run from a version tag, not $GITHUB_REF" >&2; exit 1 ;;
          esac
          git fetch --no-tags origin main
          git show origin/main:.github/allowed_signers > "$RUNNER_TEMP/allowed_signers"
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "$RUNNER_TEMP/allowed_signers"
          git verify-tag "$GITHUB_REF_NAME"
          commit_verified="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.commit.verification.verified')"
          commit_reason="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.commit.verification.reason')"
          if [ "$commit_verified" != "true" ]; then
            echo "release commit signature is not verified (reason: $commit_reason)" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "release commit is not reachable from origin/main" >&2
            exit 1
          }
      - name: Wait for the complete CI workflow on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 90); do
            successful="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=100" --jq "[.workflow_runs[] | select(.conclusion == \"success\" and .event == \"push\" and .head_branch == \"main\" and .head_sha == \"$GITHUB_SHA\")] | length")"
            if [ "$successful" -gt 0 ]; then
              echo "verified successful CI workflow for $GITHUB_SHA"
              exit 0
            fi
            echo "CI has not succeeded yet (attempt $attempt/90)"
            sleep 20
          done
          echo "no successful complete CI workflow found for $GITHUB_SHA" >&2
          exit 1

  build:
    name: Build and verify distributions
    needs: verify-ci
    if: needs.verify-ci.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned uv and frozen development environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.21
          uv sync --frozen --extra dev
      - name: Run release quality gate
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy --python-version 3.11 src
          uv run --frozen bandit -q -r src
          uv run --frozen pytest --cov=schematic_airlock --cov-branch --cov-report=term-missing
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_VERSION: ${{ env.RELEASE_PROJECT_VERSION }}
        run: |
          python -I -S - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          if version != os.environ["EXPECTED_VERSION"]:
              raise SystemExit(
                  f"project version {version!r} does not match release workflow "
                  f"version {os.environ['EXPECTED_VERSION']!r}"
              )
          expected = f"v{version}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(
                  f"release tag {os.environ['RELEASE_TAG']!r} does not match {expected!r}"
              )
          print(f"validated project version {version}")
          PY
      - name: Fix build timestamp to the source commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: Build from a clean output directory
        run: |
          rm -rf dist build
          uv run --frozen python -m build --no-isolation
      - name: Validate distribution metadata and shape
        run: |
          uv run --frozen python -m twine check --strict dist/*
          uv run --frozen python -I - <<'PY'
          import tarfile
          import zipfile
          import os
          from pathlib import Path

          from schematic_airlock.distribution_audit import audit_sdist, audit_wheel

          wheels = tuple(Path("dist").glob("*.whl"))
          sdists = tuple(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1 or len(tuple(Path("dist").iterdir())) != 2:
              raise SystemExit("expected exactly one wheel and one .tar.gz source distribution")
          with tarfile.open(sdists[0], "r:gz") as archive:
              source_names = audit_sdist(
                  archive,
                  expected_root=f"schematic_airlock-{os.environ['RELEASE_PROJECT_VERSION']}",
              )
          required_source = {
              ".github/workflows/ci.yml",
              ".github/workflows/dco.yml",
              ".github/workflows/release.yml",
              ".github/allowed_signers",
              "uv.lock",
              "CITATION.cff",
              "benchmarks/manifest.json",
              "benchmarks/voltage_constraints.py",
              "benchmarks/linear_dc_ngspice.py",
              "benchmarks/hierarchy_scale.py",
              "benchmarks/ngspice_rail_oracle.py",
              "benchmarks/results/erc-v070-regression-20260909.json",
              "benchmarks/results/hierarchy-scale-windows-20260909-v070-depth6.json",
              "benchmarks/results/hierarchy-scale-windows-20260909-v070-final-monitor-depth4.json",
              "benchmarks/results/hierarchy-scale-windows-20260909-v070-final-monitor-depth5.json",
              "benchmarks/results/hierarchy-scale-windows-20260909-v070-final-monitor-depth6.json",
              "benchmarks/results/ngspice-42-windows-rail-oracle-20260909-v2.json",
              "tests/corpus/erc/manifest.json",
              "tests/test_erc_corpus.py",
              "tests/test_hierarchy_scale.py",
              "tests/test_ngspice_rail_oracle.py",
              "tests/test_parameter_proofs.py",
              "tests/test_rail_short_paths.py",
              "tests/test_units_oracle.py",
              "tests/test_version.py",
              "docs/erc-regression-corpus.md",
              "docs/hierarchy-scaling.md",
              "docs/ngspice-rail-oracle.md",
              "corpus/portable_analog/primitives.lib",
              "corpus/portable_analog/rc_sensor_frontend.sp",
              "corpus/portable_analog/two_stage_ota.sp",
              "docs/schemas/audit-report-v1.schema.json",
              "docs/schemas/bundle-manifest-v1.schema.json",
              "docs/schemas/structural-summary-v1.schema.json",
              "docs/schemas/verification-manifest-v1.schema.json",
              "docs/schemas/verification-report-v1.schema.json",
              "docs/schemas/voltage-rules-v1.schema.json",
              "docs/schemas/voltage-report-v1.schema.json",
              "docs/voltage-envelopes.md",
              "docs/linear-dc.md",
              "docs/linear-dc-dense-oracle-audit.md",
              "docs/linear-dc-integration-audit.md",
              "docs/schemas/linear-dc-report-v1.schema.json",
              "examples/linear_dc/divider.sp",
              "examples/voltage_envelope/design.sp",
              "examples/voltage_envelope/rules.json",
              "src/schematic_airlock/dco.py",
              "src/schematic_airlock/distribution_audit.py",
              "src/schematic_airlock/release_artifacts.py",
              "src/schematic_airlock/voltage.py",
              "src/schematic_airlock/voltage_constraints.py",
              "src/schematic_airlock/voltage_rules.py",
              "src/schematic_airlock/linear_dc.py",
              "src/schematic_airlock/dc_netlist.py",
              "tests/test_linear_dc_dense_oracle.py",
          }
          if missing := required_source - source_names:
              raise SystemExit(f"source distribution is missing: {sorted(missing)}")
          with zipfile.ZipFile(wheels[0]) as archive:
              wheel_names = audit_wheel(archive)
          required_wheel = {
              "schematic_airlock/_version.py",
              "schematic_airlock/dco.py",
              "schematic_airlock/distribution_audit.py",
              "schematic_airlock/py.typed",
              "schematic_airlock/release_artifacts.py",
              "schematic_airlock/schemas/audit-report-v1.schema.json",
              "schematic_airlock/schemas/bundle-manifest-v1.schema.json",
              "schematic_airlock/schemas/structural-summary-v1.schema.json",
              "schematic_airlock/schemas/verification-manifest-v1.schema.json",
              "schematic_airlock/schemas/verification-report-v1.schema.json",
              "schematic_airlock/schemas/voltage-rules-v1.schema.json",
              "schematic_airlock/schemas/voltage-report-v1.schema.json",
              "schematic_airlock/voltage.py",
              "schematic_airlock/voltage_constraints.py",
              "schematic_airlock/voltage_rules.py",
              "schematic_airlock/linear_dc.py",
              "schematic_airlock/dc_netlist.py",
              "schematic_airlock/schemas/linear-dc-report-v1.schema.json",
          }
          if missing := required_wheel - wheel_names:
              raise SystemExit(f"wheel is missing: {sorted(missing)}")
          PY
      - name: Re-test the audited source distribution with frozen dependencies
        run: |
          source_test_root="$(mktemp -d "$RUNNER_TEMP/sdist-test.XXXXXX")"
          tar -xzf "dist/schematic_airlock-$RELEASE_PROJECT_VERSION.tar.gz" \
            --directory "$source_test_root" --no-same-owner --no-same-permissions
          (
            cd "$source_test_root/schematic_airlock-$RELEASE_PROJECT_VERSION"
            uv sync --frozen --extra dev
            uv run --frozen pytest
          )
      - name: Install wheel and smoke-check metadata and CLI version
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install --disable-pip-version-check --no-deps dist/*.whl
          .release-smoke/bin/python -I - <<'PY'
          import subprocess
          import json
          from importlib.resources import files
          from importlib.metadata import version

          import schematic_airlock

          rail = schematic_airlock.audit_text("R1 vdd bridge 0\nR2 bridge 0 0\n")
          if rail.decision.value != "deny" or [f.code for f in rail.findings] != ["RAIL002"]:
              raise SystemExit("installed wheel did not detect the composite rail short")
          scope = schematic_airlock.audit_text(
              ".subckt cell p n params: a=0 b={a+1}\n"
              ".param a=0\nR1 p n {b}\n.ends cell\nX1 vdd 0 cell params: a=4\n"
          )
          if scope.findings:
              raise SystemExit("installed wheel did not resolve final instance parameter values")
          for literal in ("1e-1000", "1e-10000", "{0"):
              uncertain = schematic_airlock.audit_text(f"R1 vdd 0 {literal}\n")
              if (
                  uncertain.decision.value == "allow"
                  or any(f.code in {"RAIL001", "RAIL002"} for f in uncertain.findings)
              ):
                  raise SystemExit("installed wheel silently converted invalid resistance to zero")

          expected = version("schematic-airlock")
          if schematic_airlock.__version__ != expected:
              raise SystemExit("runtime and distribution versions differ")
          completed = subprocess.run(
              [".release-smoke/bin/schematic-airlock", "--version"],
              check=True,
              capture_output=True,
              text=True,
          )
          if completed.stdout.strip() != f"schematic-airlock {expected}":
              raise SystemExit("CLI version does not match distribution metadata")
          schema = files("schematic_airlock").joinpath(
              "schemas/verification-report-v1.schema.json"
          ).read_text(encoding="utf-8")
          if json.loads(schema)["$schema"] != "https://json-schema.org/draft/2020-12/schema":
              raise SystemExit("installed verification schema has the wrong dialect")
          verified = subprocess.run(
              [
                  ".release-smoke/bin/schematic-airlock",
                  "verification-check",
                  "tests/fixtures/verification_bundle",
                  "--format",
                  "json",
              ],
              check=True,
              capture_output=True,
              text=True,
          )
          if json.loads(verified.stdout)["decision"] != "allow":
              raise SystemExit("installed verification CLI smoke did not allow clean evidence")
          for name in ("voltage-rules-v1", "voltage-report-v1", "linear-dc-report-v1"):
              schema = json.loads(files("schematic_airlock").joinpath(
                  f"schemas/{name}.schema.json"
              ).read_text(encoding="utf-8"))
              if schema["$schema"] != "https://json-schema.org/draft/2020-12/schema":
                  raise SystemExit(f"installed {name} schema has the wrong dialect")
          voltage = subprocess.run(
              [
                  ".release-smoke/bin/schematic-airlock",
                  "voltage-check", "examples/voltage_envelope/design.sp",
                  "--rules", "examples/voltage_envelope/rules.json",
                  "--format", "json",
              ],
              check=False, capture_output=True, text=True,
          )
          report = json.loads(voltage.stdout)
          failures = {
              item["name"]: item["status"]
              for item in report["checks"] if item["status"] != "pass"
          }
          if (
              voltage.returncode != 2 or voltage.stderr
              or report["status"] != "possible-violation"
              or len(report["checks"]) != 13
              or failures != {"device:top/mp:bd": "possible-violation"}
              or report["tool_version"] != expected
          ):
              raise SystemExit("installed voltage CLI did not reproduce the body-diode oracle")
          linear = subprocess.run(
              [
                  ".release-smoke/bin/schematic-airlock",
                  "linear-dc", "examples/linear_dc/divider.sp", "--format", "json",
              ],
              check=True, capture_output=True, text=True,
          )
          result = json.loads(linear.stdout)
          currents = {item["label"]: item["current_amperes"] for item in result["branches"]}
          if (
              linear.stderr or result["status"] != "solved"
              or result["nodes"] != {"0": "0", "out": "3", "rail": "5"}
              or currents != {"top/r1": "1/1000", "top/r2": "1/1000", "top/v1": "-1/1000"}
              or result["tool_version"] != expected
          ):
              raise SystemExit("installed linear DC CLI did not reproduce the exact divider")
          unsupported = subprocess.run(
              [
                  ".release-smoke/bin/schematic-airlock",
                  "linear-dc", "examples/voltage_envelope/design.sp", "--format", "json",
              ],
              check=False, capture_output=True, text=True,
          )
          rejected = json.loads(unsupported.stdout)
          if (
              unsupported.returncode != 2 or unsupported.stderr
              or rejected["status"] != "unsupported" or rejected["nodes"]
              or rejected["branches"] or rejected["network_id"] is not None
              or rejected["work"] is not None
          ):
              raise SystemExit("installed linear DC CLI fabricated values for transistor semantics")
          PY
          site_packages="$(.release-smoke/bin/python -I -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          installation_root="$(realpath .release-smoke)"
          workspace_root="$(realpath "$GITHUB_WORKSPACE")"
          if [ "$installation_root" != "$workspace_root/.release-smoke" ]; then
            echo "release virtual environment resolved outside its expected root" >&2
            exit 1
          fi
          case "$site_packages" in
            "$installation_root"/*) ;;
            *) echo "installed site-packages escaped the release virtual environment" >&2; exit 1 ;;
          esac
          echo "RELEASE_INSTALLATION_ROOT=$installation_root" >> "$GITHUB_ENV"
          echo "RELEASE_SITE_PACKAGES=$site_packages" >> "$GITHUB_ENV"
      - name: Generate SPDX software bill of materials
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"
          SYFT_FILE_METADATA_SELECTION: all
          SYFT_SOURCE_NAME: ${{ env.RELEASE_PROJECT_NAME }}
          SYFT_SOURCE_VERSION: ${{ env.RELEASE_PROJECT_VERSION }}
        with:
          path: .release-smoke
          format: spdx-json
          output-file: dist/SBOM.spdx.json
          syft-version: v${{ env.RELEASE_SYFT_VERSION }}
          upload-artifact: false
          upload-release-assets: false
      - name: Validate the installed-wheel SBOM and release checksums
        run: |
          uv run --frozen python -I -m schematic_airlock.release_artifacts bind-installed-wheel \
            --sbom dist/SBOM.spdx.json \
            --site-packages "$RELEASE_SITE_PACKAGES" \
            --installation-root "$RELEASE_INSTALLATION_ROOT" \
            --expected-external-path "bin/schematic-airlock" \
            --wheel "dist/schematic_airlock-$RELEASE_PROJECT_VERSION-py3-none-any.whl" \
            --name "$RELEASE_PROJECT_NAME" \
            --version "$RELEASE_PROJECT_VERSION"
          uv run --frozen python -I -m schematic_airlock.release_artifacts validate-sbom \
            --sbom dist/SBOM.spdx.json \
            --name "$RELEASE_PROJECT_NAME" \
            --version "$RELEASE_PROJECT_VERSION" \
            --syft-version "$RELEASE_SYFT_VERSION"
          uv run --frozen python -I -m schematic_airlock.release_artifacts write-checksums \
            --directory dist \
            --name "$RELEASE_PROJECT_NAME" \
            --version "$RELEASE_PROJECT_VERSION"
          uv run --frozen python -I -m schematic_airlock.release_artifacts verify-release \
            --directory dist \
            --name "$RELEASE_PROJECT_NAME" \
            --version "$RELEASE_PROJECT_VERSION" \
            --syft-version "$RELEASE_SYFT_VERSION"
      - name: Upload verified distributions and release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: |
            dist/schematic_airlock-${{ env.RELEASE_PROJECT_VERSION }}-py3-none-any.whl
            dist/schematic_airlock-${{ env.RELEASE_PROJECT_VERSION }}.tar.gz
            dist/SBOM.spdx.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  provenance:
    name: Attest build provenance
    if: github.event_name == 'push' && github.event.repository.visibility == 'public'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out release validation helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist
      - name: Re-verify downloaded release assets
        run: >-
          python -I -S src/schematic_airlock/release_artifacts.py verify-release
          --directory dist
          --name "$RELEASE_PROJECT_NAME"
          --version "$RELEASE_PROJECT_VERSION"
          --syft-version "$RELEASE_SYFT_VERSION"
      - name: Attest verified distributions
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

  github-release:
    name: Create GitHub release
    if: >-
      ${{ github.event_name == 'push' && always() && needs.build.result == 'success' &&
      (needs.provenance.result == 'success' || needs.provenance.result == 'skipped') }}
    needs: [build, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release validation helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist
      - name: Re-verify downloaded release assets
        run: >-
          python -I -S src/schematic_airlock/release_artifacts.py verify-release
          --directory dist
          --name "$RELEASE_PROJECT_NAME"
          --version "$RELEASE_PROJECT_VERSION"
          --syft-version "$RELEASE_SYFT_VERSION"
      - name: Create release exactly once
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "release tag moved: expected $GITHUB_SHA, resolved $tag_sha" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists; refusing to replace its assets."
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "dist/schematic_airlock-$RELEASE_PROJECT_VERSION-py3-none-any.whl" \
            "dist/schematic_airlock-$RELEASE_PROJECT_VERSION.tar.gz" \
            dist/SBOM.spdx.json \
            dist/SHA256SUMS \
            --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
