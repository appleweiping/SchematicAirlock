[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "schematic-airlock"
version = "0.6.0"
description = "Deterministic offline safety checks for generated SPICE artifacts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Weiping Yan" }]
keywords = ["analog", "eda", "netlist", "safety", "spice"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "bandit>=1.8",
  "build==1.6.0",
  "twine==7.0.0",
  "hatchling==1.32.0",
  "jsonschema>=4.23",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.11",
]

[project.scripts]
schematic-airlock = "schematic_airlock.cli:entrypoint"

[project.urls]
Documentation = "https://github.com/appleweiping/SchematicAirlock#readme"
Issues = "https://github.com/appleweiping/SchematicAirlock/issues"
Source = "https://github.com/appleweiping/SchematicAirlock"

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/examples", "/docs", "/corpus", "/benchmarks",
  "/.github/workflows", "/.github/allowed_signers", "/uv.lock",
  "/*.md", "/LICENSE", "/CITATION.cff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/schematic_airlock"]

[tool.hatch.build.targets.wheel.force-include]
"docs/schemas/audit-report-v1.schema.json" = "schematic_airlock/schemas/audit-report-v1.schema.json"
"docs/schemas/bundle-manifest-v1.schema.json" = "schematic_airlock/schemas/bundle-manifest-v1.schema.json"
"docs/schemas/structural-summary-v1.schema.json" = "schematic_airlock/schemas/structural-summary-v1.schema.json"
"docs/schemas/verification-manifest-v1.schema.json" = "schematic_airlock/schemas/verification-manifest-v1.schema.json"
"docs/schemas/verification-report-v1.schema.json" = "schematic_airlock/schemas/verification-report-v1.schema.json"
"docs/schemas/voltage-rules-v1.schema.json" = "schematic_airlock/schemas/voltage-rules-v1.schema.json"
"docs/schemas/voltage-report-v1.schema.json" = "schematic_airlock/schemas/voltage-report-v1.schema.json"
"docs/schemas/linear-dc-report-v1.schema.json" = "schematic_airlock/schemas/linear-dc-report-v1.schema.json"

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=schematic_airlock",
  "--cov-branch",
  "--cov-report=term-missing:skip-covered",
  "--cov-fail-under=90",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["schematic_airlock"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise AssertionError",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.bandit]
targets = ["src"]
